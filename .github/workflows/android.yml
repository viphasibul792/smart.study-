name: Android CI

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a0012c-smart-study
    paths-ignore:
      - "**.md"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Environment probe
        run: |
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true
